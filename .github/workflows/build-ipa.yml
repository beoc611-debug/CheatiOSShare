name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project CheatiOSShare.xcodeproj \
            -scheme CheatiOSShare \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CheatiOSShare.ipa Payload
          ls -lh CheatiOSShare.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatiOSShare-IPA
          path: CheatiOSShare.ipa
          retention-days: 7
