name: Build IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fix source paths
        run: ln -s . CanhiOSShare

      - name: Download Libbox.xcframework
        run: |
          curl -L "https://github.com/proother/sing-box-lib/releases/download/v1.14.2/Libbox-ios.xcframework.zip" -o /tmp/libbox.zip
          unzip -q /tmp/libbox.zip -d .
          ls Libbox.xcframework/

      - name: Build
        run: |
          xcodebuild \
            -project CheatiOSShare.xcodeproj \
            -scheme CheatiOSShare \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal

      - name: Find .app
        run: |
          find build/Build/Products -name "*.app" -type d
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CheatiOSShare.ipa Payload
          ls -lh CheatiOSShare.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CheatiOSShare-IPA
          path: CheatiOSShare.ipa
          retention-days: 7
