name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications/Xcode*.app | head -20

      - name: Select Xcode 16
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Show SDK & scheme
        run: |
          xcodebuild -project CheatiOSShare.xcodeproj -list

      - name: Build .app (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CheatiOSShare.xcodeproj \
            -scheme CheatiOSShare \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            OTHER_CODE_SIGN_FLAGS="--deep" \
            2>&1 | tee build.log
          grep -E "(error:|warning:|BUILD SUCCEEDED|BUILD FAILED)" build.log | tail -50

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release/CheatiOSShare.app Payload/
          zip -r CheatiOSShare.ipa Payload/
          ls -lh CheatiOSShare.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheatiOSShare-${{ github.sha }}
          path: CheatiOSShare.ipa
          retention-days: 30
